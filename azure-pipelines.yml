trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main

schedules:
  - cron: '0 2 * * *'
    displayName: Nightly Regression
    branches:
      include:
        - main
    always: true

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - qa
      - cert
      - prod
  - name: testTags
    displayName: 'Test Tags (e.g., @smoke)'
    type: string
    default: ''

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20.x'
  ENV: ${{ parameters.environment }}
  CI: 'true'

stages:
  - stage: Setup
    displayName: 'Setup & Install'
    jobs:
      - job: InstallDependencies
        displayName: 'Install Dependencies'
        steps:
          - task: NodeTool@0
            displayName: 'Use Node.js $(nodeVersion)'
            inputs:
              versionSpec: '$(nodeVersion)'

          - script: npm ci
            displayName: 'Install npm dependencies'

          - script: npx playwright install --with-deps
            displayName: 'Install Playwright browsers'

  - stage: Test
    displayName: 'Run API Tests'
    dependsOn: Setup
    jobs:
      - job: RunTests
        displayName: 'Execute API Tests - $(ENV)'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(nodeVersion)'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx playwright install --with-deps
            displayName: 'Install Playwright'

          - script: |
              if [ -n "${{ parameters.testTags }}" ]; then
                npx playwright test --grep "${{ parameters.testTags }}"
              else
                npx playwright test
              fi
            displayName: 'Run API Tests'
            env:
              ENV: $(ENV)
            continueOnError: true

          - script: npm run report:allure:generate || true
            displayName: 'Generate Allure Report'

          # Publish Test Results
          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results/**/*.xml'
              mergeTestResults: true
              testRunTitle: 'API Tests - $(ENV)'

          # Publish Playwright HTML Report
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Playwright Report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifactName: 'playwright-report-$(ENV)'
              publishLocation: 'pipeline'

          # Publish Allure Results
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Allure Results'
            condition: always()
            inputs:
              targetPath: 'allure-results'
              artifactName: 'allure-results-$(ENV)'
              publishLocation: 'pipeline'

          # Publish Allure Report
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Allure Report'
            condition: always()
            inputs:
              targetPath: 'allure-report'
              artifactName: 'allure-report-$(ENV)'
              publishLocation: 'pipeline'

          # Publish Logs
          - task: PublishPipelineArtifact@1
            displayName: 'Publish Logs'
            condition: always()
            inputs:
              targetPath: 'logs'
              artifactName: 'test-logs-$(ENV)'
              publishLocation: 'pipeline'
