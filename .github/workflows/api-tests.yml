name: API Automation Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - cert
      tags:
        description: 'Test tags to run (e.g., @smoke, @regression)'
        required: false
        default: ''
        type: string
  schedule:
    # Nightly regression run at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '20'

jobs:
  api-tests:
    name: API Tests - ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # GitHub Environment — loads env-specific secrets and variables
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Create Environment Config
        run: |
          mkdir -p env
          cat > env/.env.${{ github.event.inputs.environment || 'dev' }} << 'EOF'
          BASE_URL=${{ vars.BASE_URL || secrets.BASE_URL || 'https://bookstore.toolsqa.com' }}
          ENV_NAME=${{ github.event.inputs.environment || 'dev' }}
          API_USERNAME=${{ secrets.API_USERNAME || 'testuser_ci' }}
          API_PASSWORD=${{ secrets.API_PASSWORD || 'Test@12345' }}
          TOKEN_EXPIRY_BUFFER_MS=${{ vars.TOKEN_EXPIRY_BUFFER_MS || '30000' }}
          LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}
          REQUEST_TIMEOUT=${{ vars.REQUEST_TIMEOUT || '30000' }}
          RESPONSE_TIME_THRESHOLD=${{ vars.RESPONSE_TIME_THRESHOLD || '5000' }}
          MAX_WORKERS=${{ vars.MAX_WORKERS || '2' }}
          EOF

      - name: Run API Tests
        run: |
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            npx playwright test --grep "${{ github.event.inputs.tags }}"
          else
            npx playwright test
          fi
        env:
          ENV: ${{ github.event.inputs.environment || 'dev' }}
          CI: true

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.inputs.environment || 'dev' }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.event.inputs.environment || 'dev' }}
          path: allure-results/
          retention-days: 30

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.event.inputs.environment || 'dev' }}
          path: test-results/
          retention-days: 14

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.event.inputs.environment || 'dev' }}
          path: logs/
          retention-days: 14

      - name: Generate Allure Report
        if: always()
        run: |
          npm run report:allure:generate || true

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.event.inputs.environment || 'dev' }}
          path: allure-report/
          retention-days: 30

  # Publish report to GitHub Pages
  publish-report:
    name: Publish Report
    needs: api-tests
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Allure Report
        uses: actions/download-artifact@v4
        with:
          name: allure-report-${{ github.event.inputs.environment || 'dev' }}
          path: allure-report/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: test-reports
